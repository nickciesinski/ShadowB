name: Weekly Bias-Drift Check

on:
  schedule:
    # Sunday 13:05 UTC (5:05 AM PT) — after the clean-era report. Read-only:
    # writes bias-drift-reports/<date>.md, never touches weights or picks.
    - cron: '5 13 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate bias-drift report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/bias-drift-report.js
      - name: Commit report
        run: |
          git config user.name "shadow-bets-bot"
          git config user.email "shadow-bets-bot@users.noreply.github.com"
          git add bias-drift-reports/
          git diff --cached --quiet && echo "No report change" && exit 0
          git commit -m "Bias-drift check — $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push
