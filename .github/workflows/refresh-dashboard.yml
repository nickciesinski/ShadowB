name: Refresh Dashboard tab

# R0.3 — rebuilds the Sheet's Dashboard tab from Supabase (upcoming staked
# picks, staked performance, latest job status). Timed just before Nick's two
# betting windows (~9 PM and ~5:30 AM PT). Report-only: writes the Dashboard
# tab and nothing else.

on:
  schedule:
    - cron: '40 3 * * *'    # ~8:40 PM PDT / 7:40 PM PST
    - cron: '10 12 * * *'   # ~5:10 AM PDT / 4:10 AM PST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Rebuild Dashboard
        run: node scripts/refresh-dashboard.js
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
