name: Feature -> CLV Attribution

# Which feature is actually earning its weight? Measured against CLV rather
# than win/loss (sd ~2.6pp vs ~50pp), clustered by game, Bonferroni-corrected.
# Runs after the clean-era report so both land in the same Sunday commit window.
on:
  schedule:
    - cron: '45 12 * * 0'
  workflow_dispatch:
    inputs:
      league:
        description: 'League to attribute (MLB, NFL, NBA, NHL)'
        required: false
        default: 'MLB'

permissions:
  contents: write

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Attribute features to CLV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # MLB is the only league with the game volume to resolve anything this
          # season; NFL is run so its sample starts accumulating from week 1.
          node scripts/feature-clv-report.js --league MLB || true
          node scripts/feature-clv-report.js --league NFL || true
      - name: Commit report
        run: |
          git config user.name "shadow-bets-bot"
          git config user.email "shadow-bets-bot@users.noreply.github.com"
          git add feature-clv-reports/
          git diff --cached --quiet && echo "No report change" && exit 0
          git commit -m "Feature -> CLV attribution — $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-clv-report
          path: feature-clv-reports/*.md
          if-no-files-found: ignore
