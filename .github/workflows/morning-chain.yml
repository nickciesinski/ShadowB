name: Slate Build — Stats → Odds → Predictions

# BUILDS THE SLATE. DOES NOT EMAIL IT.
#
# Nick's actual requirement, stated 2026-08-30:
#   - 9 PM PT the night before: as many lines/picks as possible (the preview)
#   - 5 AM PT the next day:     the final "place these bets" card
#
# Those are two deliverables at two times, so they are two jobs. This one builds
# the slate early enough that evening-digest.yml (04:00 UTC = 9 PM PDT) has
# something to show. The "place these bets" email is final-card.yml at 05:50 UTC.
# Folding the email in here is what put Nick's bet card at 8 PM the night before.
#
# WHY THIS IS A SINGLE WORKFLOW. This used to be eight separately-cron'd
# workflows (trigger1,2,3,4,6,7,8,9) fired 30 minutes apart from 05:30 to 09:00
# UTC, chained by nothing but wall-clock hope. Two things killed that design:
#
#   1. ORDER WAS NEVER GUARANTEED. GitHub's scheduled-run jitter routinely ran
#      25-45 min late, and on 2026-08-27 it batch-delivered a 10.5h backlog:
#      trigger4 (predictions) ran at 15:13 UTC, BEFORE trigger1/2/3 (16:40,
#      17:26, 17:51). Predictions were built on the previous day's player stats,
#      team stats, and pre-refresh odds. Nobody noticed because every job
#      reported SUCCESS.
#   2. SLOT COUNT WAS THE ROOT CAUSE. Eight slots here were part of the ~45
#      scheduled runs/day this repo was asking GitHub for. See the header on
#      freeze.yml for the full accounting — GitHub started dropping ~90% of
#      them and the picks email landed at 19:40 UTC (12:40 PM PT) instead of
#      ~09:30 UTC. Collapsing these eight into one removes seven slots.
#
# The whole chain takes ~2.5 minutes of actual compute (the eight jobs' summed
# durations). Spreading that over 3.5 hours bought nothing and cost correctness.
#
# ORDER MATTERS AND IS NOW ENFORCED BY STEP ORDER: stats (1,2) and odds (3) must
# land before predictions (4); props/combos/tiers (6,7,8) enrich the sheet before
# the email (9) reads it. Do not reorder without understanding those reads.
#
# WHY 03:05 UTC AND NOT SOMETHING SANER-LOOKING.
#
# This is set by GitHub's delivery lag, not by when the picks "should" be made.
# After the Aug 2026 outage GitHub kept delivering this repo's scheduled runs
# hours after their cron, decaying only gradually as load dropped. Measured lag
# medians: Aug 27 10h24, Aug 28 9h46, Aug 29 4h01, Aug 30 2h09. The 07:05 slot
# this replaced fired at 13:07 UTC on Aug 29 — 6h02 late, which is 6:07 AM PT
# and past the point Nick needs the card.
#
# 03:05 UTC gives ~8h55 of headroom before 12:00 UTC (5:00 AM PT), so the picks
# land in time across the entire observed lag range. The tradeoff Nick accepted
# explicitly: at low lag this generates the slate around 8 PM PT the night
# before, earlier than the old ~12:40 AM PT. Earlier picks mean earlier lines.
#
# SIDE EFFECT, AND IT IS THE ONE evening-digest.js WAS BUILT FOR. That script's
# header says US rows will appear in the night-before digest "once US generation
# is shifted to the night before" — this is that shift. At 03:05 UTC the picks
# are stamped with the current UTC date, and the digest at 03:30 UTC asks for
# "tomorrow in PT", which is the same date. They now line up. Both jobs carry
# independent lag, so on any given night the digest may still win the race and
# show a short card; that is cosmetic, not a correctness problem.
#
# DO NOT move this later without re-measuring the lag. DO NOT move it before
# 00:00 UTC — the picks' date stamp comes from the UTC calendar day, so
# crossing midnight UTC files the whole slate under the wrong date.
#
# The :05 is deliberate — :00 and :30 are GitHub's highest-load cron minutes.
on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Full env block on purpose. Every trigger loads all modules, so
    # validateConfig() throws and the step exits 1 if any of these are missing.
    # Do not trim this to "just what each step needs" — that is exactly how
    # freeze.yml failed silently for its first 15 runs.
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      RANKINGS_SPREADSHEET_ID: ${{ secrets.RANKINGS_SPREADSHEET_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      - name: Smoke-test approval engine
        run: node -e "require('./src/approval-engine')"

      # ── Data refresh ─────────────────────────────────────────────
      # continue-on-error: a flaky ESPN/odds call must NOT cost Nick the whole
      # slate. Predictions run on slightly staler inputs; that beats no picks.
      # The step still shows red in the run summary, so failures stay visible.
      - name: Trigger 1 — Update player stats
        run: node src/triggers.js trigger1
        continue-on-error: true

      - name: Trigger 2 — Update team stats
        run: node src/triggers.js trigger2
        continue-on-error: true

      - name: Trigger 3 — Odds + grade yesterday + CLV snapshot
        run: node src/triggers.js trigger3
        continue-on-error: true

      # ── Predictions: the step that actually writes the picks ─────
      # NO continue-on-error. If this fails there is nothing to email and the
      # run must go red.
      - name: Trigger 4 — MLB + NBA predictions
        run: node src/triggers.js trigger4

      # ── Enrichment ───────────────────────────────────────────────
      - name: Trigger 6 — Player props
        run: node src/triggers.js trigger6
        continue-on-error: true

      - name: Trigger 7 — Platform combos
        run: node src/triggers.js trigger7
        continue-on-error: true

      - name: Trigger 8 — Player tiers
        run: node src/triggers.js trigger8
        continue-on-error: true

      # NO EMAIL STEP HERE ON PURPOSE. trigger9 lives in final-card.yml so the
      # bet card lands by 5 AM PT, not at 8 PM the night before. See that file.
