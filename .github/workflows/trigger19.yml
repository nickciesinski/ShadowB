name: Trigger 19 — Pre-Close Odds Pull (CLV)

# Pre-slate odds pulls. Sole purpose: refresh odds and roll last_seen_* on open
# tickets so the frozen close is near first pitch instead of hours stale. Runs
# year-round; with no games inside the lock window the fetch returns nothing and
# the roll is a no-op, which is cheap and safe.
#
# 2026-08-07: KEEP THIS CRON LIST SHORT. Seven slots was tried and backfired
# badly — GitHub put the workflow into its scheduling backlog, cancelled two
# runs outright, and delivered the other five in a single batch 4-6h late, long
# after every game had finished. That day averaged 6.92h close lag and 30 of 33
# tickets were over 2h. The previous three-slot config averaged 1.07h with 42 of
# 45 under 2h. Scheduled-run reliability DEGRADES as slot count rises, so adding
# slots to chase a stale cluster makes the problem worse, not better. Four is
# the ceiling. If a cluster is still stale, diagnose which games and why —
# do not add crons.
on:
  schedule:
    # One afternoon slot (earliest observed start 16:36 UTC).
    - cron: '0 16 * * *'
    # Evening slate — bulk of starts land 22:36-23:20 UTC.
    - cron: '15 20 * * *'
    - cron: '0 21 * * *'
    - cron: '45 21 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Pre-close odds pull plus CLV roll
        run: node src/triggers.js trigger19
        # Full env block on purpose. Every trigger loads all modules, so
        # validateConfig() throws and the job exits 1 if any of these are
        # missing — that's exactly how freeze.yml failed silently for its first
        # 15 runs. Do not trim this to "just what trigger19 needs".
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
