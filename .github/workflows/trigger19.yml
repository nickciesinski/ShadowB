name: Trigger 19 — Pre-Close Odds Pull (CLV)

# Pre-slate odds pulls, timed to land before the earliest MLB starts (~22:36 UTC).
# Sole purpose: refresh odds and roll last_seen_* on open tickets so the frozen
# close is near first pitch instead of ~4-6h stale. Runs year-round; on days
# with no games inside the lock window the odds fetch returns nothing and the
# roll is a no-op, which is cheap and safe.
# Fires three times across the pre-slate window. GitHub delivers scheduled crons
# late by an unpredictable 0-70min (observed: trigger19 57min late, trigger11
# 71min late), so a single run cannot be buffered reliably. On 2026-08-04 the
# 21:45 cron landed at 22:41 — five minutes after the first games started, so
# those 12 tickets were excluded by commenceTimeFrom=now and kept a 4.28h stale
# price, while the 33 later games got 0.89h. Three shots means at least one
# lands well before the earliest start regardless of jitter.
#
# Each run costs ~3 credits per active league on a 20k/month budget, so the
# extra pulls are immaterial. Runs are idempotent: the roll simply takes the
# freshest snapshot, so a later run strictly improves on an earlier one.
on:
  schedule:
    # Afternoon slate (earliest observed start 16:36-18:10 UTC). trigger10's
    # 17:00 cron is NOT reliable cover: on 2026-08-05 it landed at 18:15, five
    # minutes after an 18:10 first pitch, so that game froze on its 09:19
    # morning price at 8.8h stale.
    - cron: '30 15 * * *'
    - cron: '15 16 * * *'
    # Mid-afternoon (18:30-20:30 UTC / 2:30-4:30pm ET — weekend and getaway-day
    # slates). With jitter, trigger10's 17:00 run covers only to ~18:15 and the
    # 20:15 slot starts there, leaving a ~2h hole these two fill.
    - cron: '45 18 * * *'
    - cron: '30 19 * * *'
    # Evening slate (bulk starts 22:36-23:20 UTC).
    - cron: '15 20 * * *'
    - cron: '0 21 * * *'
    - cron: '45 21 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Pre-close odds pull plus CLV roll
        run: node src/triggers.js trigger19
        # Full env block on purpose. Every trigger loads all modules, so
        # validateConfig() throws and the job exits 1 if any of these are
        # missing — that's exactly how freeze.yml failed silently for its first
        # 15 runs. Do not trim this to "just what trigger19 needs".
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NODE_ENV: production
