name: Weekly Injury Tuner
# 2026-11-03 — learns how much injuries are worth from graded results, picks
# the best rating formula, and switches the injury feature on/off through the
# 3-week out-of-sample gate (src/injury-tuning.js). Runs Tuesday after the
# weekly player-rankings refresh (trigger18, 10:00 UTC) and Monday Night
# Football grading.
on:
  schedule:
    - cron: '17 15 * * 2'  # Tuesday 15:17 UTC (7:17 AM PT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (analyze and email, change nothing)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci

      - name: Run injury tuner
        id: tune
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/injury-tuner.js $ARGS

      - name: Commit tuning state (+ weights when they changed)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "shadow-bets-bot"
          git config user.email "shadow-bets-bot@users.noreply.github.com"
          git add config/injury-tuning.json weight-reviews/injury-tuning-*.json
          if [ "${{ steps.tune.outputs.params_changed }}" = "true" ]; then
            git add config/model-params.*.json
          fi
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "injury tuner: weekly check${{ steps.tune.outputs.params_changed == 'true' && ' — weights changed' || '' }} [skip ci]"
          git pull --rebase origin main
          git push
