name: Evening Digest — Tomorrow's Picks Email

# Emails the full slate of picks for TOMORROW across every league in the shared
# ledger, so the bets can be reviewed the night before and the earliest lines
# are captured. This is Nick's 9 PM PT "show me as many lines as possible"
# checkpoint.
#
# Dispatched by Vercel Cron at 04:00 UTC = 21:00 PDT (UTC-7) / 20:00 PST.
# The slate build is dispatched two hours earlier (02:00 UTC) and lands by
# 02:59 UTC at the latest, so the US rows always exist by the time this reads
# them — the race that used to make this show a short card is gone.
on:
  # 2026-08-31 — no `schedule:` here on purpose. GitHub delivered this
  # workflow anywhere from 39 min to 13.6 h after its cron; Vercel Cron now
  # dispatches it on time (web/vercel.json -> /api/cron/slate). Re-adding a
  # schedule would double-send whenever GitHub eventually caught up.
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional YYYY-MM-DD slate date (defaults to tomorrow PT)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Send tomorrow's picks digest
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/evening-digest.js --date=${{ github.event.inputs.date }}
          else
            node scripts/evening-digest.js
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          NODE_ENV: production
