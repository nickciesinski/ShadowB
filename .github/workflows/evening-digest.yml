name: Evening Digest — Tomorrow's Picks Email

# Runs 9:00pm PDT (8:00pm during PST — cron is fixed UTC) and emails
# the full slate of picks for TOMORROW across every league in the shared ledger,
# so the bets can be reviewed the night before and the earliest lines are captured.
# 04:00 UTC = 21:00 PDT (UTC-7) / 20:00 PST (UTC-8). This is Nick's 9 PM PT
# "show me as many lines as possible" checkpoint. It runs 55 min after
# slate-build (03:05 UTC) so the US rows exist by the time it reads them.
# Both carry independent GitHub delivery lag, so on a bad night the digest can
# still win the race and show a short card — cosmetic, not a correctness bug.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional YYYY-MM-DD slate date (defaults to tomorrow PT)'
        required: false
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Send tomorrow's picks digest
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            node scripts/evening-digest.js --date=${{ github.event.inputs.date }}
          else
            node scripts/evening-digest.js
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          NODE_ENV: production
